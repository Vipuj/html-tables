<!DOCTYPE html>
<html>
<head>
    <title>HTML Tables</title>
</head>
<body>

    <!-- table creates the table -->
    <!-- tr creates a row -->
    <!-- th creates a heading cell -->
    <!-- td creates a normal data cell -->
    <table border="1">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Course</th>
        </tr>
        <tr>
            <td>Vipuj</td>
            <td>19</td>
            <td>CSE AI/ML</td>
        </tr>
        <tr>
            <td>Student 2</td>
            <td>19</td>
            <td>CSE</td>
        </tr>
    </table>

</body>
</html>
